[package]
name = "redoubt-core"
description = "Redoubt scanning engine: signature database, YARA matching, heuristics, quarantine."
version.workspace    = true
edition.workspace    = true
license.workspace    = true
authors.workspace    = true
repository.workspace = true

[dependencies]
anyhow.workspace      = true
thiserror.workspace   = true
serde.workspace       = true
serde_json.workspace  = true
toml.workspace        = true
tracing.workspace     = true
parking_lot.workspace = true
dashmap.workspace     = true
rayon.workspace       = true
walkdir.workspace     = true
sha2.workspace        = true
sha1.workspace        = true
md-5.workspace        = true
hex.workspace         = true
flate2.workspace      = true
tar.workspace         = true
memmap2.workspace     = true
time.workspace        = true
yara-x = "1.20.0"
aho-corasick = "1.1.5"
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }
goblin = { version = "0.10.7", default-features = false, features = ["pe32", "pe64", "std", "endian_fd"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate", "bzip2"] }
memchr = "2.8.3"
