[package]
name = "redoubt-amsi"
description = "Redoubt AMSI provider: pre-execution scanning for scripts and macros."
version.workspace    = true
edition.workspace    = true
license.workspace    = true
authors.workspace    = true
repository.workspace = true

[lib]
name = "redoubt_amsi"
# A COM in-process server. Loaded into every AMSI host on the machine, so it
# deliberately depends on almost nothing: no engine, no signature index, no
# async runtime. It sends bytes to the Redoubt service and returns a verdict.
# rlib alongside cdylib so the COM plumbing can be unit-tested;
# a cdylib alone produces no test harness.
crate-type = ["cdylib", "rlib"]

[dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_System_Threading",
] }

[dev-dependencies]
# Only the tests need these. The shipped DLL depends on windows-sys and
# nothing else - it is loaded into every script host on the machine, and an
# engine or an async runtime in that position would be a liability.
redoubt-core = { path = "../redoubt-core" }
redoubt-service = { path = "../redoubt-service" }

[build-dependencies]
# Stamps the icon and version metadata onto the binary. A security tool with a
# blank icon and no publisher in its properties is one nobody should trust with
# administrator rights.
winresource = "0.1"
